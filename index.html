<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Playfair Display', serif;
  background: linear-gradient(135deg, #b1bfdf, #d6e0f5);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
}

/* HEADER */
.profile-img {
  width: 120px;
  height: 120px;
  border-radius: 60%;
  border: 3px solid white;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  animation: fadeIn 1s ease;
}

h1 {
  margin: 15px 0 5px;
  font-size: 24px;
  color: #FFE4E1;
}

p {
  margin: 10px 0;
  font-size: 18px;
  color: #FAF0E6;
}

/* BOTTONI */
.container {
  width: 100%;
  max-width: 420px;
  margin-top: 30px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.8);
  color: #333;
  text-decoration: none;
  padding: 18px;
  margin-bottom: 15px;
  border-radius: 15px;
  font-size: 18px;
  transition: 0.3s;
}

.btn i {
  margin-right: 12px;
}

.btn:hover {
  background-color: #ff78a9;
  color: white;
  transform: scale(1.05);
}

/* DARK MODE */
body.dark-mode {
  background: linear-gradient(135deg, #000000,#483d8b,#000000);
  color: white;
}

.theme-switch {
  margin-top: 20px;
}

#theme-toggle {
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  background: #4b0082;
  color: white;
  cursor: pointer;
}

/* TABELLA + STICKER */
.tabella-container{
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 30px;
  margin-top: 30px;
  flex-wrap: wrap;
}

/* TABELLA */
#miaTabella {
  width: 350px;
  border-collapse: collapse;
  text-align: center;
  background: rgba(255,255,255,0.7);
  border-radius: 15px;
  overflow: hidden;
}

th, td {
  border: 1px solid #ddd;
  padding: 10px;
}

/* STICKER */
.sticker{
  width: 100px;
  height: auto;
  animation: float 3s ease-in-out infinite;
}

/* ANIMAZIONE STICKER */
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-12px); }
  100% { transform: translateY(0px); }
}

/* FORM */
#contact-form{
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 420px;
  margin-top: 30px;
}

#contact-form input,
#contact-form textarea{
  margin-bottom: 15px;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

#contact-form button{
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #4b0082;
  color: white;
  cursor: pointer;
}

/* ANIMAZIONI */
@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

</style>
</head>

<script>
  // CARICAMENTO
document.addEventListener("DOMContentLoaded", function() {

  alert("Benvenuto nel mio Linktree!");

  const pulsante = document.getElementById('theme-toggle');
  const corpo = document.body;

  // Mantiene il tema salvato
  if (localStorage.getItem("tema") === "dark") {
    corpo.classList.add("dark-mode");
    pulsante.innerText = "☀️ Modalità Luce";
  }

  pulsante.addEventListener('click', () => {

    corpo.classList.toggle('dark-mode');

    if (corpo.classList.contains('dark-mode')) {
      pulsante.innerText = "☀️ Modalità Luce";
      localStorage.setItem("tema", "dark");
    } else {
      pulsante.innerText = "🌙 Modalità Notte";
      localStorage.setItem("tema", "light");
    }

  });

  // CONTROLLO EMAIL
  document.getElementById('contact-form')
  .addEventListener('submit', function(e) {

    const email =
    document.getElementById('email').value;

    if (!email.includes('@')) {

      e.preventDefault();

      alert("Inserisci un indirizzo email valido!");

    }

  });

});



});

// FADE TABELLA
$(document).ready(function() {
  $("#miaTabella").hide().fadeIn(2000);
});

</script>
