<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  font-family: 'Playfair Display', serif;
  background: linear-gradient(135deg, #b1bfdf, #d6e0f5);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
  transition: 0.5s ease;
}

/* DARK MODE */
body.dark-mode {
  background: linear-gradient(135deg, #000000, #2c2c54, #000000);
  color: white;
}

/* PROFILO */
.profile-img {
  width: 120px;
  height: 120px;
  border-radius: 60%;
  border: 3px solid white;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  animation: fadeIn 1s ease;
}

h1 {
  margin: 15px 0 5px;
  font-size: 24px;
  color: #FFE4E1;
}

p {
  font-size: 18px;
  color: #FAF0E6;
}

/* CONTENITORE */
.container {
  width: 100%;
  max-width: 420px;
  margin-top: 30px;
}

/* BOTTONI */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.85);
  color: #333;
  text-decoration: none;
  padding: 18px;
  margin-bottom: 15px;
  border-radius: 15px;
  font-size: 18px;
  transition: 0.3s;
}

.btn i {
  margin-right: 12px;
}

.btn:hover {
  background-color: #ff78a9;
  color: white;
  transform: scale(1.05);
}

/* DARK BUTTON */
body.dark-mode .btn {
  background: rgba(50,50,50,0.8);
  color: white;
}

/* SWITCH */
.theme-switch {
  margin-top: 20px;
}

#theme-toggle {
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  background: #4b0082;
  color: white;
  cursor: pointer;
}

/* TABELLA */
.tabella-container{
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  margin-top: 30px;
  flex-wrap: wrap;
}

#miaTabella {
  width: 350px;
  border-collapse: collapse;
  text-align: center;
  background: rgba(255,255,255,0.7);
  border-radius: 15px;
  overflow: hidden;
}

th, td {
  border: 1px solid #ddd;
  padding: 10px;
}

/* STICKER */
.sticker{
  width: 100px;
  animation: float 3s ease-in-out infinite;
}

/* FLOAT */
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-15px); }
  100% { transform: translateY(0px); }
}

/* FORM */
#contact-form{
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 420px;
  margin-top: 30px;
}

#contact-form input,
#contact-form textarea{
  margin-bottom: 15px;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

#contact-form button{
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #4b0082;
  color: white;
  cursor: pointer;
}

/* ANIMAZIONE */
@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

</style>
</head>

<script>

// CARICAMENTO
document.addEventListener("DOMContentLoaded", function() {
  alert("Benvenuto nel mio Linktree!");
  const pulsante = document.getElementById('theme-toggle');
  const corpo = document.body;
});

/* TEMA NOTTE */
const btn = document.getElementById("theme-toggle");
const body = document.body;

if(localStorage.getItem("tema") === "dark"){
  body.classList.add("dark-mode");
  btn.innerText = "☀️ Modalità Luce";
}

btn.addEventListener("click", () => {
  body.classList.toggle("dark-mode");

  if(body.classList.contains("dark-mode")){
    btn.innerText = "☀️ Modalità Luce";
    localStorage.setItem("tema","dark");
  } else {
    btn.innerText = "🌙 Modalità Notte";
    localStorage.setItem("tema","light");
  }
});

/* EMAIL CHECK */
document.getElementById("contact-form").addEventListener("submit", function(e){
  const email = document.getElementById("email").value;

  if(!email.includes("@")){
    e.preventDefault();
    alert("Email non valida");
  }
});

/* ANIMAZIONE TABELLA */
$(document).ready(function(){
  $("#miaTabella").hide().fadeIn(2000);
});
 
</script>
